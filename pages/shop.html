<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Shop | MRITYUNJAY AYURVEDA</title>
        <link rel="icon" href="../assets/images/logo.jpeg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../index.css">
    </head>
    <body data-root="../" data-page="shop">
        <section class="ph-hero">
            <span class="eyebrow">The Collection</span>
            <h1>Shop MRITYUNJAY AYURVEDA</h1>
            <p class="lead" style="margin:12px auto 0">All products are demonstration items with demo prices.</p>
        </section>
        <section class="sec" style="padding-top:40px">
            <div class="wrap">
                <div class="bar">
                    <div class="chips" id="chips"></div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap">
                        <input id="sq" placeholder="Search products">
                        <select id="pf">
                            <option value="all">All prices</option>
                            <option value="lo">Under ₹300</option>
                            <option value="mid">₹300 – ₹450</option>
                            <option value="hi">Above ₹450</option>
                        </select>
                        <select id="so">
                            <option value="pop">Popularity</option>
                            <option value="new">Newest</option>
                            <option value="pa">Price: Low to High</option>
                            <option value="pd">Price: High to Low</option>
                        </select>
                    </div>
                </div>
                <div class="grid" id="sg"></div>
            </div>
        </section>
        <script src="../pack.js"></script>
        <script src="../index.js"></script>
    </body>
</html>
